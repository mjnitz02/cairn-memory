name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903  # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: make lint
      # verify-st needs a SillyTavern checkout and stays local; this one does not.
      - run: make verify-rules

  # SillyTavern declares engines.node ">= 20"; 22 is its Docker LTS and 24 its
  # CI runtime, so we cover the range a user could plausibly be on.
  test:
    name: Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903  # v5.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: make test

  version:
    name: Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          fetch-depth: 0
      - name: manifest.json and package.json agree
        run: make version-check
      - name: Version bumped since the base branch
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          current=$(node -p "require('./manifest.json').version")
          base=$(git show origin/${{ github.base_ref }}:manifest.json | node -p "JSON.parse(require('fs').readFileSync(0)).version")
          if [ "$current" = "$base" ]; then
            echo "✗ version is still $base — bump manifest.json and package.json."
            exit 1
          fi
          echo "✓ $base -> $current"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          fetch-depth: 0  # gitleaks scans history, not just the working tree
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan for leaked secrets
        run: gitleaks detect --config .gitleaks.toml --redact --no-banner -v
