# The aim is one pull request a week that nobody has to touch. npm is dev
# tooling only — nothing it installs ships — and actions are pinned by SHA
# (CLAUDE.md §9.33), so Dependabot bumps the pin and its version comment.
#
#   - Version updates for both ecosystems share ONE multi-ecosystem group, so a
#     week's bumps arrive as a single PR instead of one per ecosystem.
#   - Security updates can't join that group (multi-ecosystem groups are
#     version-updates only) and otherwise open one PR per vulnerable package.
#     The `applies-to: security-updates` group on each entry folds them into
#     one PR per ecosystem.
#   - dependabot-automerge.yml merges all of the above once the required
#     checks pass.
version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: "weekly"

updates:
  - package-ecosystem: "npm"
    directory: "/"
    # `patterns` is required on every member of a multi-ecosystem group.
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
    # Nobody reviews these PRs before they merge, so wait a week after a
    # release: time for a compromised or broken version to be yanked upstream.
    # Security updates ignore the cooldown.
    cooldown:
      default-days: 7
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
    cooldown:
      default-days: 7
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
