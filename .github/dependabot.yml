# Security updates are switched on in the repo settings; this file adds the
# weekly version bumps. npm is dev tooling only — nothing it installs ships.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dev-tooling:
        patterns: ["*"]

  # Actions are pinned by SHA (CLAUDE.md §9.33); Dependabot bumps the pin and its comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
